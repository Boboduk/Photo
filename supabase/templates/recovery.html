<!doctype html>
<html lang="ru">
  <body style="margin:0;padding:32px 16px;background:#f5f5f4;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#0c0c0d">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px">
      <tr>
        <td style="padding:36px 36px 8px">
          <p style="margin:0 0 28px;font-size:16px;font-weight:700;letter-spacing:0.2em">FRAME</p>
          <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3">Восстановление доступа</h1>
          <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#444">Мы получили запрос на смену пароля. Нажмите на кнопку, чтобы задать новый пароль. Ссылка действует ограниченное время.</p>
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password" style="display:inline-block;padding:13px 24px;background:#0c0c0d;color:#ffffff;text-decoration:none;border-radius:999px;font-size:15px;font-weight:600">Задать новый пароль</a>
        </td>
      </tr>
      <tr>
        <td style="padding:28px 36px 36px;font-size:13px;line-height:1.6;color:#8a8a90">Если вы не запрашивали смену пароля, проигнорируйте письмо — пароль останется прежним.</td>
      </tr>
    </table>
  </body>
</html>
