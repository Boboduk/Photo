# Конфигурация локального Supabase (npx supabase start).
# Для облачного проекта те же настройки задаются в Supabase Dashboard — см. README.

project_id = "frame"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Внешний адрес API и издатель токенов Auth. Именно localhost, а не 127.0.0.1: MCP-клиенты
# (Claude Code) открывают страницу входа по http только для localhost, остальное — только https.
external_url = "http://localhost:54321"

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

# OAuth 2.1 сервер Supabase Auth: через него ИИ-ассистенты (MCP-клиенты) входят
# в аккаунт пользователя и получают обычный токен — права проверяет RLS.
# Страница согласия — src/app/(site)/oauth/consent. В облаке: Authentication → OAuth Server.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m0s"

[auth.email.template.confirmation]
subject = "Подтвердите почту — FRAME"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Восстановление доступа — FRAME"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Подтвердите новый адрес почты — FRAME"
content_path = "./supabase/templates/email_change.html"
